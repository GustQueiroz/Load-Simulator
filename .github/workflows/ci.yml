name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, architecture, test, build, perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which is what writes the lockfile locally.
      # On npm 10 the same lock fails `npm ci`: it drops two of the six
      # packages bundled inside @tailwindcss/oxide-wasm32-wasi.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Without this, an older npm fails with a cryptic EUSAGE about two
      # packages nobody in this project depends on directly.
      - name: Fail early if npm is older than the lockfile's writer
        run: |
          version=$(npm --version)
          echo "npm $version"
          if [ "${version%%.*}" -lt 11 ]; then
            echo "::error::This lockfile is written by npm 11. npm $version drops two of the packages bundled inside @tailwindcss/oxide-wasm32-wasi and fails npm ci."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes layer import fences)
        run: npm run lint

      - name: Architecture (dependency-cruiser)
        run: npm run architecture

      # The simulation engine is pure TypeScript, so the whole suite runs
      # without a browser — including tick/commit latency budgets.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle weight budget
        run: npm run perf:weight

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI latency / FPS / heap budget
        run: npm run perf:ui

      # Runs against the static export that the build above produced, which is
      # the artifact that actually ships.
      - name: End-to-end (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
